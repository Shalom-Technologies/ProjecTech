name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts
      - name: Run tests
        run: pytest -q --tb=short -rf 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Show test failures in the run summary
        if: failure()
        run: |
          python - <<'PY'
          import urllib.parse
          log = open("pytest.log").read()[-3500:]
          print("::error title=pytest failed::" + log.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com
